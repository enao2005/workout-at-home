<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10-Min Workout Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .timer-circle {
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
        /* Custom Scrollbar for list */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden">

    <!-- App Container -->
    <div class="max-w-md w-full mx-auto h-full flex flex-col bg-white shadow-xl relative">
        
        <!-- Header -->
        <header class="bg-slate-900 text-white p-4 shadow-md z-10 flex-shrink-0 text-center">
            <h1 class="text-xl font-bold tracking-wider">10-MIN WORKOUT</h1>
        </header>

        <!-- SELECTION SCREEN -->
        <main id="selectionScreen" class="flex-1 flex flex-col overflow-hidden fade-in">
            <div class="p-4 bg-slate-50 border-b flex justify-between items-center z-10">
                <p class="text-sm text-slate-600 font-semibold">10種類のワークアウトを選択</p>
                <div id="selectionCounter" class="bg-slate-200 text-slate-800 px-3 py-1 rounded-full text-sm font-bold">
                    0 / 10
                </div>
            </div>
            
            <div id="workoutList" class="flex-1 overflow-y-auto p-4 space-y-6">
                <!-- List will be generated by JS -->
            </div>

            <div class="p-4 border-t bg-white z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                <button id="startBtn" disabled class="w-full py-4 rounded-xl font-bold text-lg transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed bg-blue-600 text-white shadow-lg disabled:shadow-none hover:bg-blue-700 active:scale-95">
                    ワークアウトを開始
                </button>
            </div>
        </main>

        <!-- TIMER SCREEN -->
        <main id="timerScreen" class="flex-1 flex flex-col hidden fade-in bg-slate-50">
            <!-- Phase Indicator -->
            <div id="phaseIndicator" class="text-center py-3 text-white font-bold text-lg tracking-widest shadow-md transition-colors duration-500 bg-red-500">
                WORKOUT
            </div>

            <div class="flex-1 overflow-y-auto p-6 flex flex-col items-center">
                <!-- Status Header -->
                <div class="w-full flex justify-between text-sm font-bold text-slate-500 mb-4">
                    <span id="setIndicator">Set 1 / 10</span>
                    <span id="nextWorkoutPreview" class="text-right truncate w-48">Next: ---</span>
                </div>

                <!-- Circular Timer -->
                <div class="relative w-64 h-64 mb-8 flex-shrink-0">
                    <svg class="w-full h-full" viewBox="0 0 100 100">
                        <circle class="text-slate-200 stroke-current" stroke-width="6" cx="50" cy="50" r="45" fill="transparent"></circle>
                        <circle id="timerPath" class="text-red-500 stroke-current timer-circle" stroke-width="6" stroke-linecap="round" cx="50" cy="50" r="45" fill="transparent" stroke-dasharray="283" stroke-dashoffset="0"></circle>
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span id="timeDisplay" class="text-6xl font-bold font-mono tracking-tighter text-slate-800">40</span>
                        <span id="phaseLabel" class="text-sm font-bold text-slate-400 mt-1 uppercase">Work</span>
                    </div>
                </div>

                <!-- Workout Details -->
                <div class="w-full bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex-1 flex flex-col">
                    <h2 id="currentWorkoutName" class="text-2xl font-bold text-slate-800 mb-2 border-b pb-2">ワークアウト名</h2>
                    <div class="overflow-y-auto flex-1 pr-2">
                        <p id="currentWorkoutDesc" class="text-slate-600 text-sm leading-relaxed mb-3 font-medium">動作の説明がここに入ります。</p>
                        <div class="bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r-lg">
                            <p class="text-xs font-bold text-amber-800 mb-1">ポイント</p>
                            <p id="currentWorkoutPoints" class="text-amber-700 text-xs leading-relaxed">ポイントの説明がここに入ります。</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="p-4 bg-white border-t flex space-x-4">
                <button id="quitBtn" class="flex-1 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition-colors">
                    終了
                </button>
                <button id="pauseBtn" class="flex-[2] py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition-colors shadow-md">
                    一時停止
                </button>
            </div>
        </main>
        
        <!-- FINISH SCREEN -->
        <main id="finishScreen" class="flex-1 flex flex-col items-center justify-center hidden fade-in bg-white p-6 text-center">
            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mb-6">
                <svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-3xl font-bold text-slate-800 mb-4">お疲れ様でした！</h2>
            <p class="text-slate-600 mb-8">10分間のワークアウトを完了しました。</p>
            <button id="homeBtn" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-colors shadow-lg">
                トップに戻る
            </button>
        </main>

    </div>

    <script>
        const workoutData = [
            // 脚（下半身）
            { id: 'l1', category: '脚（下半身）', name: 'ヒップリフト', description: '仰向けになり、膝を90度に曲げて足裏を床につけます。息を吐きながら、かかとで床を押すようにお尻をゆっくり持ち上げます。肩から膝が一直線になる位置でキープし、息を吸いながら下ろします。', points: '腰を反らせるのではなく、お尻と太もも裏の筋肉を使うことを意識します。' },
            { id: 'l2', category: '脚（下半身）', name: 'ワイドスクワット', description: '両足を肩幅の1.5〜2倍に開き、つま先を外側45度に向けます。膝がつま先と同じ方向を向くように意識して、お尻を真下に沈めます。太ももが床と平行になる手前で止め、立ち上がります。', points: '上体が前に倒れすぎないように背筋を伸ばし、内ももの伸びを感じながら行います。' },
            { id: 'l3', category: '脚（下半身）', name: 'カーフレイズ', description: '足を腰幅に開いてまっすぐ立ちます。ふくらはぎを意識しながら、かかとをゆっくりと限界まで高く引き上げます。頂点で1秒キープした後、かかとが床につくギリギリまで下ろします。', points: '反動を使わず、足首が外側や内側に逃げないよう真っ直ぐに上げ下げします。' },
            { id: 'l4', category: '脚（下半身）', name: 'ドンキーキック', description: '四つんばいになります。片膝を90度に曲げたまま、足裏で天井を押し上げるようにお尻の力で脚を持ち上げます。お尻が収縮するのを感じたら、ゆっくり元の位置に戻します。', points: '動作中に腰が反ったり、骨盤が傾いたりしないように体幹をしっかり固定します。' },
            { id: 'l5', category: '脚（下半身）', name: 'ファイヤハイドラント', description: '四つんばいの姿勢を作ります。片膝を90度に曲げたまま、犬がマーキングをするように真横へ脚を開き上げます。限界まで上げたらゆっくりと閉じます。', points: '体が横に開いてしまわないように両手でしっかり床を押し、骨盤を床と平行に保ちます。' },
            { id: 'l6', category: '脚（下半身）', name: 'スクワット', description: '足を肩幅に開き、つま先はやや外側へ向けます。見えない椅子に座るようにお尻を後ろへ引きながらしゃがみ、足の裏全体で床を押して立ち上がります。', points: '膝がつま先より大きく前に出ないこと、背中が丸まらないことを意識します。' },
            { id: 'l7', category: '脚（下半身）', name: 'ランジ', description: '足を腰幅に開いて立ちます。片足を大きく前に踏み出し、前後の膝が90度になるまで真下に腰を沈めます。前足のかかとで床を強く蹴り、元の姿勢に戻ります。', points: '踏み出した前の膝が内側に入ったり、つま先より前に出たりしないようにコントロールします。' },
            { id: 'l8', category: '脚（下半身）', name: 'サイドランジ', description: '両足を揃えて立ちます。片足を大きく真横へ踏み出し、踏み出した側の膝を曲げてお尻を後ろに引きます。もう片方の脚は伸ばし、踏み出した足で蹴って戻ります。', points: 'しゃがむときは背中を丸めず、股関節から折りたたむようにしてお尻を後ろに引きます。' },
            { id: 'l9', category: '脚（下半身）', name: 'ウォールシット', description: '壁を背にして立ち、背中を壁に沿わせて滑り降り、膝と股関節が90度になる位置（空気椅子）で静止します。両手は体の横か胸の前に保ちます。', points: '膝がつま先より前に出ないように足の位置を調整し、太ももとお尻で体重を支えます。' },
            { id: 'l10', category: '脚（下半身）', name: 'ブルガリアンスクワット', description: '椅子や台を背にして立ち、片足のつま先を乗せます。前の脚に体重を乗せ、背筋を伸ばしたまま、前膝が90度になるまで腰をまっすぐ下に沈めて立ち上がります。', points: '後ろの脚の力は抜き、前の太ももとお尻に負荷が集中するようにバランスを取ります。' },

            // お腹（体幹）
            { id: 'a1', category: 'お腹（体幹）', name: 'クランチ', description: '仰向けで膝を90度に曲げます。息を吐きながら、おへそを覗き込むように背中を丸め、肩甲骨が床から離れる位置まで上体を起こし、ゆっくり戻します。', points: '腰全体が浮くほど高く起き上がる必要はありません。腹筋の上部をギュッと縮める意識を持ちます。' },
            { id: 'a2', category: 'お腹（体幹）', name: 'ヒールタッチクランチ', description: '仰向けで膝を立て、肩甲骨を浮かせます。息を吐きながら、右手で右かかとをタッチするように体を真横に曲げ、次に左側と交互に繰り返します。', points: '常に肩甲骨を浮かせた状態をキープし、脇腹が縮むのを感じながら動かします。' },
            { id: 'a3', category: 'お腹（体幹）', name: 'プランク', description: 'うつ伏せになり、肩の下に肘をついて前腕を床につけます。腰を浮かせて、頭からかかとまでを板のように一直線にしてキープします。', points: 'お尻が跳ね上がったり、腰が反ったりしないよう、お腹に力を入れて体を真っ直ぐに保ちます。' },
            { id: 'a4', category: 'お腹（体幹）', name: 'レッグレイズ', description: '仰向けになり、両足を揃えて伸ばします。息を吐きながら床と垂直になるまで両脚を持ち上げ、息を吸いながらかかとが床につくギリギリまで下ろします。', points: '脚を下ろす際に腰が反って浮きやすくなるため、おへそを床に押し付けるようにお腹に力を入れ続けます。' },
            { id: 'a5', category: 'お腹（体幹）', name: 'ロシアンツイスト', description: '床に座って膝を軽く曲げ、上体を45度後ろに倒します。両手を胸の前で組み、息を吐きながら上半身を右に大きく捻り、続いて左に捻ります。', points: '腕だけで捻るのではなく、おへそから上全体を捻るようにして、脇腹の筋肉をしっかり使います。' },
            { id: 'a6', category: 'お腹（体幹）', name: 'サイドプランク', description: '横向きに寝て、肩の真下に肘をつきます。腰を床から浮かせて、頭から足元まで一直線を作りキープします。', points: '下側の脇腹でお腹を引き上げる意識を持ち、体が前や後ろに傾かないようにします。' },
            { id: 'a7', category: 'お腹（体幹）', name: 'フラッターキック', description: '仰向けになり、両手を腰の下に敷きます。両足を少し浮かせ、膝を伸ばしたまま水泳のバタ足のように両脚を小刻みに上下に動かし続けます。', points: '動作中は常にお腹に力を入れ、腰が床から離れないように固定します。' },
            { id: 'a8', category: 'お腹（体幹）', name: 'バイシクルクランチ', description: '仰向けで両手を頭の後ろに添え、両足を浮かせます。自転車を漕ぐように右膝を引き寄せ、上体を捻って左肘と右膝を近づけ、左右交互に行います。', points: '動作を速くしすぎず、しっかりと上体を捻りきって腹斜筋を収縮させます。' },
            { id: 'a9', category: 'お腹（体幹）', name: 'マウンテンクライマー', description: '腕立て伏せの姿勢になります。走るようなイメージで、右膝を胸へ引き寄せ、すぐさま左膝を胸へ引き寄せる動作を素早く交互に繰り返します。', points: '動作中にどんどんお尻が高く上がってしまわないよう、重心を低く体幹を固定したまま動かします。' },
            { id: 'a10', category: 'お腹（体幹）', name: 'V字腹筋', description: '仰向けになり、両手と両足を伸ばします。息を吐きながら同時に持ち上げ、お尻を支点に「V」の字を作り、手でつま先にタッチしてゆっくり戻ります。', points: '反動を使わず、腹筋の力でコントロールしながら起き上がり、下ろすときもゆっくり負荷を逃がさないように。' },

            // 背中
            { id: 'b1', category: '背中', name: 'バックエクステンション', description: 'うつ伏せになり、両手は頭の後ろに添えます。息を吐きながら、背中の筋肉を意識してゆっくりと上体をそらし、胸を浮かせます。頂点で静止しゆっくり下ろします。', points: '腰を無理に反らすのではなく、背中全体の筋肉を使って引き上げる意識で行います。反動は厳禁。' },
            { id: 'b2', category: '背中', name: 'タオル・ラットプルダウン', description: 'タオルを両手で持ち、ピンと張って頭上に構えます。背筋を伸ばし、息を吐きながらタオルを胸の前に向かって引き下げ、ゆっくり頭上へ戻します。', points: 'タオルが緩まないように常に外側に引っ張る力を保ちながら、肩甲骨を中央に寄せます。' },
            { id: 'b3', category: '背中', name: 'バードドッグ', description: '四つんばいになり背中を平らにします。右腕を前方へ、左足を後方へ、床と平行になるまで同時にまっすぐ伸ばします。数秒キープして戻し反対も行います。', points: '手足を上げたときに体がグラグラしないよう体幹を固定し、腰が反らないように注意します。' },
            { id: 'b4', category: '背中', name: 'エアロウイング', description: '膝を軽く曲げて上体を45度前傾させ、両腕は前に伸ばします。息を吐きながら、肩甲骨を中央に寄せて両肘を背中の後ろへ高く引き上げ、ゆっくり戻します。', points: '肩がすくまないように首を長く保ち、腕の力ではなく背中の筋肉で引き上げるイメージを持ちます。' },
            { id: 'b5', category: '背中', name: 'スーパーマン', description: 'うつ伏せになり両手両足を伸ばします。息を吐きながら両手・両胸・両足を同時に高く持ち上げます。収縮を感じながらキープし、ゆっくり下ろします。', points: '手足の指先を遠くへ引っ張られるようなイメージで、体を前後に伸ばしながら持ち上げます。' },
            { id: 'b6', category: '背中', name: 'リバース・スノーエンジェル', description: 'うつ伏せになり胸を少し浮かせます。両手を前方に伸ばし、床に触れないようにお尻の横まで円を描くように動かして肩甲骨を寄せ、前方へ戻します。', points: '動作中は常に背中の緊張を解かず、肩甲骨の可動域を大きく使うことを意識します。' },
            { id: 'b7', category: '背中', name: 'プローン・YTIレイズ', description: 'うつ伏せで胸を浮かせます。両手を「Y」の字に開いて持ち上げキープ、次に「T」の字で持ち上げキープ、最後に「I」の字で体の横に沿わせて後ろへ持ち上げキープ。', points: 'それぞれの角度で、使われている背中の筋肉（上部・中部・下部）が違うことを意識しながら行います。' },
            { id: 'b8', category: '背中', name: 'グッドモーニング', description: '足を腰幅に開き、両手は頭の後ろへ。膝を軽く曲げたまま、股関節を支点にお辞儀をするように上体を前に倒し、お尻を締めて元の姿勢に起き上がります。', points: '上体を倒す際に背中が丸まらないように、常に胸を張った状態をキープします。' },
            { id: 'b9', category: '背中', name: 'スイマー', description: 'うつ伏せになり両手両足を少し浮かせます。右手と左足、左手と右足を交互に、水泳のバタ足のようなイメージで素早く上下に動かし続けます。', points: 'リズム良く動かしながらも、体幹が左右にブレないように中心軸をしっかり保ちます。' },
            { id: 'b10', category: '背中', name: 'プランク・ロウ', description: '腕立て伏せの姿勢（ハイプランク）になります。体幹を固定したまま、右手の肘を天井に向けて引き上げゆっくり下ろします。次は左手を行います。', points: '片手を離した際に体が横に開いてしまわないよう、お腹と背中に強く力を入れて踏ん張ります。' }
        ];

        let selectedWorkouts = [];
        let currentPhase = 'select'; // select, work, rest, done
        let currentWorkoutIndex = 0;
        let timeLeft = 0;
        let timerInterval = null;
        let isPaused = false;
        
        const WORK_DURATION = 40;
        const REST_DURATION = 20;

        // UI Elements
        const screens = {
            selection: document.getElementById('selectionScreen'),
            timer: document.getElementById('timerScreen'),
            finish: document.getElementById('finishScreen')
        };
        const workoutListEl = document.getElementById('workoutList');
        const selectionCounterEl = document.getElementById('selectionCounter');
        const startBtn = document.getElementById('startBtn');
        
        const phaseIndicator = document.getElementById('phaseIndicator');
        const timeDisplay = document.getElementById('timeDisplay');
        const timerPath = document.getElementById('timerPath');
        const phaseLabel = document.getElementById('phaseLabel');
        const currentWorkoutNameEl = document.getElementById('currentWorkoutName');
        const currentWorkoutDescEl = document.getElementById('currentWorkoutDesc');
        const currentWorkoutPointsEl = document.getElementById('currentWorkoutPoints');
        const setIndicator = document.getElementById('setIndicator');
        const nextWorkoutPreview = document.getElementById('nextWorkoutPreview');
        const pauseBtn = document.getElementById('pauseBtn');
        const quitBtn = document.getElementById('quitBtn');
        const homeBtn = document.getElementById('homeBtn');

        // Speech Synthesis
        const synth = window.speechSynthesis;

        function speak(text) {
            if (synth.speaking) {
                synth.cancel();
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 1.1; // Slightly faster for workout pace
            synth.speak(utterance);
        }

        // Initialize Selection List
        function initSelectionList() {
            const categories = ['脚（下半身）', 'お腹（体幹）', '背中'];
            
            categories.forEach(cat => {
                const group = document.createElement('div');
                group.className = 'mb-6';
                group.innerHTML = `<h3 class="text-lg font-bold text-slate-800 mb-3 border-b-2 border-slate-200 pb-1">${cat}</h3>`;
                
                const items = workoutData.filter(w => w.category === cat);
                items.forEach(item => {
                    const ytQuery = encodeURIComponent(item.name + ' やり方');
                    const ytLink = `https://www.youtube.com/results?search_query=${ytQuery}`;
                    
                    const row = document.createElement('label');
                    row.className = 'flex items-center p-3 mb-2 bg-white border border-slate-200 rounded-xl shadow-sm cursor-pointer hover:bg-slate-50 transition-colors';
                    row.innerHTML = `
                        <input type="checkbox" value="${item.id}" class="workout-checkbox w-5 h-5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 mr-4">
                        <div class="flex-1">
                            <div class="font-bold text-slate-700">${item.name}</div>
                        </div>
                        <a href="${ytLink}" target="_blank" class="ml-2 px-3 py-1 bg-red-100 text-red-600 text-xs font-bold rounded-full hover:bg-red-200 transition-colors z-10" onclick="event.stopPropagation()">
                            ▶ 動画
                        </a>
                    `;
                    
                    const checkbox = row.querySelector('.workout-checkbox');
                    checkbox.addEventListener('change', handleSelectionChange);
                    
                    group.appendChild(row);
                });
                
                workoutListEl.appendChild(group);
            });
        }

        function handleSelectionChange() {
            const checkboxes = document.querySelectorAll('.workout-checkbox:checked');
            const selectedIds = Array.from(checkboxes).map(cb => cb.value);
            
            selectionCounterEl.textContent = `${selectedIds.length} / 10`;
            
            if (selectedIds.length === 10) {
                selectionCounterEl.classList.remove('bg-slate-200', 'text-slate-800');
                selectionCounterEl.classList.add('bg-green-500', 'text-white');
                startBtn.disabled = false;
                selectedWorkouts = selectedIds.map(id => workoutData.find(w => w.id === id));
            } else {
                selectionCounterEl.classList.add('bg-slate-200', 'text-slate-800');
                selectionCounterEl.classList.remove('bg-green-500', 'text-white');
                startBtn.disabled = true;
                
                // Prevent selecting more than 10
                if (selectedIds.length > 10) {
                    this.checked = false;
                    handleSelectionChange(); // Recalculate
                    alert('選択できるのは10個までです。');
                }
            }
        }

        // Screen Transitions
        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
        }

        // Timer Logic
        function startWorkout() {
            // Trick to unlock Web Speech API on iOS (must be triggered by user click)
            const unlockSpeech = new SpeechSynthesisUtterance('');
            synth.speak(unlockSpeech);

            currentWorkoutIndex = 0;
            showScreen('timer');
            startWorkPhase();
            
            if (!timerInterval) {
                timerInterval = setInterval(tick, 1000);
            }
        }

        function startWorkPhase() {
            currentPhase = 'work';
            timeLeft = WORK_DURATION;
            isPaused = false;
            
            const w = selectedWorkouts[currentWorkoutIndex];
            
            // Visual Updates
            phaseIndicator.textContent = 'WORKOUT';
            phaseIndicator.className = 'text-center py-3 text-white font-bold text-lg tracking-widest shadow-md transition-colors duration-500 bg-red-500';
            timerPath.className = 'text-red-500 stroke-current timer-circle';
            phaseLabel.textContent = 'WORK';
            
            updateUIInfo();
            
            // Voice Guidance: [Name], Start! [Name]. [Description]
            speak(`${w.name}、スタート！ ${w.name}。${w.description}`);
            
            updateTimerDisplay();
        }

        function startRestPhase() {
            currentPhase = 'rest';
            timeLeft = REST_DURATION;
            
            // Visual Updates
            phaseIndicator.textContent = 'REST';
            phaseIndicator.className = 'text-center py-3 text-white font-bold text-lg tracking-widest shadow-md transition-colors duration-500 bg-blue-500';
            timerPath.className = 'text-blue-500 stroke-current timer-circle';
            phaseLabel.textContent = 'REST';
            
            // Show next workout info in main area briefly
            const nextW = selectedWorkouts[currentWorkoutIndex + 1];
            currentWorkoutNameEl.textContent = "休憩中...";
            currentWorkoutDescEl.textContent = `深呼吸してリラックスしましょう。次は ${nextW.name} です。`;
            currentWorkoutPointsEl.parentElement.classList.add('hidden');
            
            updateTimerDisplay();
        }

        function updateUIInfo() {
            const w = selectedWorkouts[currentWorkoutIndex];
            
            setIndicator.textContent = `Set ${currentWorkoutIndex + 1} / 10`;
            
            if (currentWorkoutIndex < 9) {
                nextWorkoutPreview.textContent = `Next: ${selectedWorkouts[currentWorkoutIndex + 1].name}`;
            } else {
                nextWorkoutPreview.textContent = `Next: Finish!`;
            }

            currentWorkoutNameEl.textContent = w.name;
            currentWorkoutDescEl.textContent = w.description;
            currentWorkoutPointsEl.textContent = w.points;
            currentWorkoutPointsEl.parentElement.classList.remove('hidden');
        }

        function tick() {
            if (isPaused) return;
            
            timeLeft--;
            updateTimerDisplay();

            if (currentPhase === 'work') {
                if (timeLeft === 20) {
                    speak("残り20秒です。半分経過しました！");
                } else if (timeLeft === 3) {
                    if (currentWorkoutIndex === 9) {
                        speak("3、2、1、すべてのワークアウトが終了しました。お疲れ様でした！");
                    } else {
                        const nextName = selectedWorkouts[currentWorkoutIndex + 1].name;
                        speak(`3、2、1、終了です。次は${nextName}です。`);
                    }
                } else if (timeLeft <= 0) {
                    if (currentWorkoutIndex === 9) {
                        endWorkout();
                    } else {
                        startRestPhase();
                    }
                }
            } else if (currentPhase === 'rest') {
                if (timeLeft <= 0) {
                    currentWorkoutIndex++;
                    startWorkPhase();
                }
            }
        }

        function updateTimerDisplay() {
            timeDisplay.textContent = timeLeft;
            
            const total = currentPhase === 'work' ? WORK_DURATION : REST_DURATION;
            // Calculate stroke dashoffset for circle animation (circumference is ~283)
            const circumference = 2 * Math.PI * 45; 
            const offset = circumference - (timeLeft / total) * circumference;
            timerPath.style.strokeDashoffset = offset;
        }

        function togglePause() {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? '再開' : '一時停止';
            pauseBtn.className = isPaused 
                ? 'flex-[2] py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl transition-colors shadow-md'
                : 'flex-[2] py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition-colors shadow-md';
                
            if (isPaused) {
                synth.cancel(); // Stop speaking if paused
            }
        }

        function quitWorkout() {
            if(confirm("ワークアウトを終了してトップに戻りますか？")) {
                endWorkout(true);
            }
        }

        function endWorkout(isQuit = false) {
            clearInterval(timerInterval);
            timerInterval = null;
            synth.cancel();
            
            if (isQuit) {
                resetApp();
                showScreen('selection');
            } else {
                showScreen('finish');
            }
        }

        function resetApp() {
            selectedWorkouts = [];
            currentWorkoutIndex = 0;
            isPaused = false;
            pauseBtn.textContent = '一時停止';
            pauseBtn.className = 'flex-[2] py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl transition-colors shadow-md';
            
            // Reset checkboxes
            document.querySelectorAll('.workout-checkbox').forEach(cb => cb.checked = false);
            handleSelectionChange(); // Reset counter and button
        }

        // Event Listeners
        startBtn.addEventListener('click', startWorkout);
        pauseBtn.addEventListener('click', togglePause);
        quitBtn.addEventListener('click', quitWorkout);
        homeBtn.addEventListener('click', () => {
            resetApp();
            showScreen('selection');
        });

        // Initialize App
        initSelectionList();

    </script>
</body>
</html>
